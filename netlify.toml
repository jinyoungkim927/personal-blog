[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "18"

# The about page moved onto the homepage
[[redirects]]
  from = "/about"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about/"
  to = "/"
  status = 301
  force = true

# Retired pages
[[redirects]]
  from = "/gallery/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/graph/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
